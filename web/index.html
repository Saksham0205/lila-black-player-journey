<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/lila-logo.png" />
    <title>LILA BLACK — Player Journey Explorer</title>
    <meta name="description" content="Visualize player movement, combat, and storm deaths across LILA BLACK's maps." />
    <script>
      try {
        var t = localStorage.getItem("lila-theme");
        document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
